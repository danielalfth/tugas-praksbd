<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1 class="text-center mb-4">Daftar Mahasiswa (Kelompok 31)</h1>
    
    <a href="/add" class="btn btn-success mb-3">Tambah Mahasiswa</a>
    
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>NIM</th>
                <th>Nama</th>
                <th>Angkatan</th>
                <th>Gender</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mhs : ${mahasiswa}">
                <td th:text="${mhs.nim}"></td>
                <td th:text="${mhs.nama}"></td>
                <td th:text="${mhs.angkatan}"></td>
                <td th:text="${mhs.gender}"></td>
                <td>
                    <a th:href="@{/detail/{nim}(nim=${mhs.nim})}" class="btn btn-info btn-sm">Detail</a>
                    <a th:href="@{/edit/{nim}(nim=${mhs.nim})}" class="btn btn-primary btn-sm ml-1">Edit</a>
                    <a th:href="@{/delete/{nim}(nim=${mhs.nim})}" class="btn btn-danger btn-sm ml-1">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
